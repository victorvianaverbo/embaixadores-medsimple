<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Recebida! - MEDsimple</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/seja-embaixador/style.css">

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=214459200395796&ev=PageView&noscript=1"/></noscript>
    <!-- End Meta Pixel Code -->
    <style>
        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .success-icon {
            font-size: 5rem;
            color: var(--color-emerald-500);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <main class="thank-you-page">
        <div class="container">
            <div class="success-icon">✨</div>
            <h1 class="hero-title">Parabéns, <span id="user-name"></span>!</h1>
            <p class="hero-subtitle">Sua candidatura como representante MEDsimple foi enviada com sucesso. Nossa equipe entrará em contato em breve via WhatsApp ou e-mail.</p>
            
            <div class="hero-actions">
                <a href="/" class="btn btn-primary">Voltar para o site</a>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const nome = params.get('nome');
            if (nome) {
                document.getElementById('user-name').textContent = nome.split(' ')[0];
            } else {
                document.getElementById('user-name').textContent = 'Mediciner';
            }
        });
    </script>
</body>
</html>
